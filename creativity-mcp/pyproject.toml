[project]
name = "creativity-mcp"
version = "0.1.0"
description = "MCP server with anti-convergence forcing functions for creative ideation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0.0",
]

[project.scripts]
creativity-mcp = "creativity_mcp:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creativity_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "anyio>=3.0",
]
